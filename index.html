:root[data-theme="contrast"]{--c3:#0033CC;--ring:0 0 0 3px var(--card),0 0 0 6px var(--focus)}
:root[data-theme="contrast"] .card,:root[data-theme="contrast"] .ccard,:root[data-theme="contrast"] .seg{border:2px solid var(--line2)}
:root[data-theme="contrast"] .inp{border-width:2px}
:root[data-theme="contrast"] #view a:not(.btn){text-decoration:underline;text-underline-offset:3px}
:root[data-theme="linnen"] h1{font-size:clamp(32px,3.6vw,42px);line-height:1.05}
:root[data-theme="linnen"] h2{font-size:calc(23px*var(--fs))}
/* Tekstgrootte en lettertype-voorkeur (overschrijft het thema) */
:root[data-size="groot"]{--fs:1.125}
:root[data-size="extragroot"]{--fs:1.25}
:root[data-font="inter"]{--f-body:"Inter",system-ui,sans-serif;--f-display:"Inter",system-ui,sans-serif;--f-feat:"cv05","cv08";--dw1:750;--dw2:650}
:root[data-font="atkinson"]{--f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;--f-display:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,sans-serif;--f-feat:normal;--dw1:800;--dw2:700}
:root[data-font="lexend"]{--f-body:"Lexend",system-ui,sans-serif;--f-display:"Lexend",system-ui,sans-serif;--f-feat:normal;--dw1:700;--dw2:600}
/* Grafiek: kleur plus lijnstijl */
.legend .ln{width:22px;height:0;border-top:3px solid var(--c);background:none!important;border-radius:0}
.legend .ln.dash{border-top-style:dashed}
.legend .ln.dot{border-top-style:dotted}
.nav .cnt{background:var(--cnt)!important;color:var(--onCnt)!important}
.delta{white-space:nowrap}
/* Weergave-kiezer */
.thgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.thcard{display:grid;gap:10px;padding:10px;border:1.5px solid var(--line);border-radius:var(--r-card);background:var(--card);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.thcard:hover{border-color:var(--line2)}
.thcard[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thcard .prev{display:grid;grid-template-columns:30% 1fr;height:108px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.thcard .ps{display:grid;gap:6px;padding:10px 8px;align-content:start;border-right:1px solid rgba(0,0,0,.06)}
.thcard .ps i{display:block;height:6px;border-radius:3px}
.thcard .pc{display:grid;gap:7px;padding:10px 12px;align-content:start}
.thcard .pc .aa{font-size:26px;line-height:1}
.thcard .pc i{display:block;height:6px;border-radius:3px;width:85%}
.thcard .pk{display:flex;gap:5px;margin-top:2px}
.thcard .pk span{height:18px;flex:1;border-radius:5px}
.thcard .tt{display:grid;gap:2px}
.thcard .tt b{font-size:calc(15px*var(--fs))}
.thcard .tt small{color:var(--muted);font-size:calc(14px*var(--fs));line-height:1.4}
.fontopt{font-size:calc(17px*var(--fs))}
@media (max-width:560px){.thgrid{grid-template-columns:minmax(0,1fr)}}
:root[data-theme="linnen"] .kpi .v{font-family:var(--f-body);font-weight:650;font-size:calc(34px*var(--fs));letter-spacing:-.03em}
:root[data-theme="linnen"] .brand{font-family:var(--f-body);font-weight:700;letter-spacing:-.02em}


*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 calc(15px*var(--fs))/1.55 var(--f-body);font-feature-settings:var(--f-feat);-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--f-display);}
h3{font-weight:650}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,3vw,32px);font-weight:var(--dw1);letter-spacing:var(--hls);line-height:1.15}
h2{font-size:calc(18px*var(--fs));font-weight:var(--dw2);letter-spacing:var(--hls);line-height:1.3}
h3{font-size:calc(16px*var(--fs));font-weight:700;line-height:1.35}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{box-shadow:var(--ring)!important;outline:none}
#view:focus-visible,.palette input:focus-visible,.inpwrap input:focus-visible{box-shadow:none!important}
.kv .pill{justify-self:start}
.note>span>.small,.note>div>.small{display:block}
.note .link{margin-top:4px}
.pop.calpop{max-height:none;overflow:visible}
.mono,.id{font-family:var(--f-mono);font-size:calc(14px*var(--fs));letter-spacing:0}
.id{color:var(--muted2);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .muted2{color:var(--muted2)}
.small{font-size:calc(15px*var(--fs))} .xs{font-size:calc(14px*var(--fs))}
.eyebrow{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--sideFg);border-right:1px solid var(--sideLine);display:flex;flex-direction:column;gap:16px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font:var(--dw1) calc(21px*var(--fs))/1 var(--f-display);letter-spacing:var(--hls);padding:6px 8px;color:var(--sideFg)}
.brand small{display:block;font:500 calc(13px*var(--fs))/1.2 var(--f-body);color:var(--sideM);letter-spacing:0;margin-top:3px}
.locbtn{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px;width:100%;border:1px solid var(--sideLine);background:var(--sideIn);border-radius:12px;padding:10px 12px;color:var(--sideFg)}
.locbtn:hover{background:var(--sideSel)}
.locbtn .l{font-size:calc(13px*var(--fs));color:var(--sideM);grid-column:1}
.locbtn .v{font-weight:600;grid-column:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.locbtn .ic{grid-row:1/3;grid-column:2;color:var(--sideM)}
.navgrp{display:grid;gap:1px}
.navgrp .h{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sideH);padding:10px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--sideM);font-weight:500;width:100%;position:relative;text-decoration:none}
.nav:hover{background:var(--sideSel);color:var(--sideFg)}
.nav[aria-current="page"]{background:var(--sideSel);color:var(--sideFg);font-weight:600}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--sideAcc)}
.nav[aria-current="page"] .ic{color:var(--sideAcc)}
.nav .cnt{margin-left:auto;font-size:calc(13px*var(--fs));font-weight:700;background:var(--acc);color:var(--onAcc);border-radius:999px;padding:0 7px;line-height:18px}
.nav .new{margin-left:auto;font-size:calc(13px*var(--fs));font-weight:700;letter-spacing:.05em;color:var(--sideM);border:1px solid var(--sideLine);border-radius:5px;padding:0 5px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}
.side .foot{margin-top:auto;font-size:calc(14px*var(--fs));color:var(--sideH);padding:0 10px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 28px}
.cmdk{flex:1;min-width:0;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--tHead);border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--muted2)}
.cmdk:hover{border-color:var(--line2)}
.cmdk span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.kbd{font:500 calc(13px*var(--fs)) var(--f-mono);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted2);background:var(--card)}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn .dot{position:absolute;top:8px;right:9px;min-width:8px;height:8px;border-radius:50%;background:var(--away);box-shadow:0 0 0 2px var(--card)}
.userbtn{display:flex;align-items:center;gap:10px;text-align:right;line-height:1.25;padding:4px 6px 4px 10px;border-radius:12px}
.userbtn:hover{background:var(--hover)}
.userbtn b{display:block;font-size:calc(15px*var(--fs))} .userbtn span.r{font-size:calc(13px*var(--fs));color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--selT);color:var(--ink);display:grid;place-items:center;font:700 13px var(--f-body);letter-spacing:-.02em;flex:none}
.av.lg{width:52px;height:52px;font-size:18px}
.burger{display:none}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:calc(14px*var(--fs));font-weight:600;color:var(--okD);padding:5px 10px;border-radius:999px;background:var(--okT)}
.syncpill.off{color:var(--accD);background:var(--accTint)}
.syncpill i{width:7px;height:7px;border-radius:50%;background:currentColor}

.rolebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 28px;background:var(--card);border-bottom:1px solid var(--line);font-size:calc(14px*var(--fs))}
.content{padding:24px 28px 56px;display:grid;gap:20px;min-width:0;max-width:1440px;width:100%}

/* segmented */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--tHead);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:5px 12px;border-radius:9px;font-weight:600;font-size:calc(15px*var(--fs));color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh2)}
.seg .c{font-size:calc(13px*var(--fs));font-weight:700;padding:0 6px;border-radius:999px;background:var(--selT);color:var(--ink);line-height:20px}
.seg button[aria-selected="true"] .c,.seg button[aria-pressed="true"] .c{background:var(--ink);color:var(--card)}
.seg.lg button{padding:8px 14px;font-size:calc(15px*var(--fs))}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}

/* page head */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.phead .t{display:grid;gap:6px;max-width:72ch;min-width:0}
.crumbs{font-size:calc(15px*var(--fs));color:var(--muted2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs button{color:var(--muted);font-weight:500}.crumbs button:hover{color:var(--ink);text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s;box-shadow:var(--sh1)}
.btn:hover{background:var(--hover);border-color:var(--inpB)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onAcc);box-shadow:var(--sh1)}
.btn.pri:hover{background:#E8AE24}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.dark:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.btn.danger:hover{background:var(--errT)}
.btn.dangerfill{background:var(--errS);border-color:var(--errS);color:var(--onErrS)}
.btn.sm{height:32px;padding:0 12px;font-size:calc(15px*var(--fs));border-radius:9px}
.btn.big{height:54px;font-size:calc(17px*var(--fs));border-radius:14px;width:100%;white-space:normal}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn .ic{width:16px;height:16px}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--link);text-decoration-thickness:2px;text-underline-offset:3px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration-color:var(--ink)}

/* fields */
.field{display:grid;gap:6px;min-width:0;align-content:start}
.field>label,.field>.lbl{font-size:calc(15px*var(--fs));font-weight:600}
.field .hint{font-size:calc(14px*var(--fs));color:var(--muted2)}
.field .err{font-size:calc(14px*var(--fs));color:var(--err);font-weight:600}
.inp{height:42px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:0 12px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;resize:vertical}
.inp:hover{border-color:var(--muted2)}
.inp:focus{border-color:var(--ink);box-shadow:var(--ring)}
.inp.bad{border-color:var(--err)}
.req{color:var(--err)}
.inpwrap{display:flex;align-items:center;gap:8px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:0 12px;height:42px}
.inpwrap:focus-within{border-color:var(--ink);box-shadow:var(--ring)}
.inpwrap input{border:0;background:none;outline:none;flex:1;min-width:0;height:100%}
.inpwrap.sm{height:36px}

/* custom select trigger */
.sel{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:6px 10px 6px 12px;text-align:left;transition:border-color .12s,box-shadow .12s}
.sel:hover{border-color:var(--muted2)}
.sel[aria-expanded="true"]{border-color:var(--ink);box-shadow:var(--ring)}
.sel .sv{flex:1;min-width:0;display:grid;line-height:1.3}
.sel .sv b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .sv small{font-size:calc(14px*var(--fs));color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel .ph{color:var(--muted2);font-weight:400}
.sel .chev{color:var(--muted2);transition:transform .15s}
.sel[aria-expanded="true"] .chev{transform:rotate(180deg)}
.sel.sm{min-height:34px;padding:3px 8px 3px 10px;border-radius:9px}
.sel .lead{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tHead);flex:none}

/* popover / listbox */
.pop{position:fixed;z-index:40;background:var(--raise);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh3);padding:6px;min-width:220px;max-width:min(420px,calc(100vw - 24px));max-height:min(420px,70vh);overflow:auto;animation:popin .12s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .psearch{position:sticky;top:-6px;background:var(--raise);padding:4px 2px 6px;margin:-2px 0 4px;border-bottom:1px solid var(--lineS)}
.pop .grp{font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:8px 10px 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.opt[aria-selected="true"]{background:var(--selT)}
.opt.act,.opt:hover{background:var(--hover)}
.opt[aria-selected="true"].act{background:var(--selT)}
.opt .ot{flex:1;min-width:0;display:grid;line-height:1.3}
.opt .ot b{font-weight:600}
.opt .ot small{font-size:calc(14px*var(--fs));color:var(--muted2)}
.opt .om{font-size:calc(14px*var(--fs));color:var(--muted);white-space:nowrap}
.opt .ck{width:16px;color:var(--ink);visibility:hidden}
.opt[aria-selected="true"] .ck{visibility:visible}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.opt .lead{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tHead);flex:none}
.opt.danger{color:var(--err)}
.pop .sep{height:1px;background:var(--lineS);margin:4px 0}
.pop .none{padding:16px;text-align:center;color:var(--muted2);font-size:calc(15px*var(--fs))}

/* checkbox / radio / switch */
.cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--inpB);background:var(--card);display:grid;place-items:center;flex:none;transition:background .12s,border-color .12s;color:var(--card)}
.cbox .ic{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.6);transition:all .12s}
[aria-checked="true"]>.cbox,[aria-checked="true"] .cbox{background:var(--ink);border-color:var(--ink)}
[aria-checked="true"]>.cbox .ic,[aria-checked="true"] .cbox .ic{opacity:1;transform:none}
.rdot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--inpB);background:var(--card);flex:none;display:grid;place-items:center}
.rdot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .12s}
[aria-checked="true"] .rdot{border-color:var(--ink)}
[aria-checked="true"] .rdot::after{transform:scale(1)}
.ccard{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;transition:border-color .12s,background .12s,box-shadow .12s}
.ccard:hover{border-color:var(--line2);background:var(--hover)}
.ccard[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card)}
.ccard .ct{flex:1;min-width:0;display:grid;gap:1px}
.ccard .ct b{font-weight:600}
.ccard .ct small{font-size:calc(14px*var(--fs));color:var(--muted)}
.ccard .cm{font-size:calc(14px*var(--fs));color:var(--muted);white-space:nowrap}
.ccard[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.sw{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
[aria-checked="true"] .sw{background:var(--ok)}
[aria-checked="true"] .sw::after{transform:translateX(16px)}
.swrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0}
.hrs{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}.hrs .stepper{flex:1;min-width:0;justify-content:space-between}.hrs .stepper button{width:34px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--inpB);border-radius:var(--r-ctl);overflow:hidden;height:42px;background:var(--card)}
.stepper button{width:40px;height:100%;display:grid;place-items:center;color:var(--muted)}
.stepper button:hover{background:var(--hover);color:var(--ink)}
.stepper b{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}

/* calendar */
.cal{padding:6px;width:288px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .gr span{font-size:calc(13px*var(--fs));color:var(--muted2);font-weight:600;padding:4px 0}
.cal .d{height:34px;border-radius:9px;font-size:calc(15px*var(--fs));font-variant-numeric:tabular-nums}
.cal .d:hover{background:var(--hover)}
.cal .d.today{box-shadow:inset 0 0 0 1px var(--line2)}
.cal .d.sel{background:var(--ink);color:var(--card);font-weight:700}
.cal .d.out{color:var(--muted2)}
.cal .times{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--lineS)}
.cal .times button{padding:4px 8px;border-radius:7px;font-size:calc(14px*var(--fs));border:1px solid var(--line)}
.cal .times button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;min-width:0;box-shadow:var(--sh1)}
.card.flush{padding:0;overflow:hidden}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card.flush>.ch{padding:16px 20px;margin:0;border-bottom:1px solid var(--lineS)}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh1);transition:border-color .12s,box-shadow .12s,transform .12s;position:relative}
.tile:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.tile[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink),var(--sh2)}
.tile .go{position:absolute;right:14px;bottom:14px;color:var(--muted2);transition:transform .12s}
.tile:hover .go{transform:translateX(2px);color:var(--ink)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.split.list{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.split.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:16px;align-content:start;min-width:0}
.stack.tight{gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.hr{height:1px;background:var(--lineS)}
.sticky{position:sticky;top:76px}

/* KPI */
.kpi{display:grid;gap:8px;align-content:start}
.kpi .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font:var(--dw1) calc(32px*var(--fs))/1 var(--f-display);letter-spacing:var(--hls);font-variant-numeric:tabular-nums}
.kpi .v small{font:500 calc(16px*var(--fs)) var(--f-body);color:var(--muted);letter-spacing:0;margin-left:6px}
.delta{font-size:calc(14px*var(--fs));font-weight:600;padding:1px 7px;border-radius:999px;background:var(--tHead);color:var(--muted)}
.delta.up{background:var(--okT);color:var(--okD)} .delta.dn{background:var(--errT);color:var(--err)}
.meter{height:8px;border-radius:999px;background:var(--track);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;background:var(--ink);border-radius:999px}
.meter i.ok{background:var(--ok)} .meter i.away{background:var(--away)} .meter i.warn{background:var(--acc)} .meter i.err{background:var(--err)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:calc(14px*var(--fs));font-weight:600;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.nodot::before{display:none}
.p-ok{background:var(--okT);color:var(--okD)}
.p-away{background:var(--awayT);color:var(--awayD)}
.p-warn{background:var(--accTint);color:var(--accD)}
.p-err{background:var(--errT);color:var(--err)}
.p-n{background:var(--tHead);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-ink{background:var(--ink);color:var(--card)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:calc(14px*var(--fs));font-weight:600;padding:1px 8px;border-radius:6px;background:var(--tHead);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:calc(15px*var(--fs))}
th{background:var(--tHead);text-align:left;font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{display:inline-flex;align-items:center;gap:4px;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
th button:hover{color:var(--ink)}
td{padding:12px 16px;border-bottom:1px solid var(--lineS);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer;transition:background .1s}
tr.click:hover{background:var(--hover)}
tr.click td.go{width:36px;color:var(--muted2);padding-left:0}
tr.click:hover td.go{color:var(--ink)}
tr.sel{background:var(--selT)}
td.r,th.r{text-align:right}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person b{display:block;font-weight:600;white-space:nowrap}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:calc(14px*var(--fs));color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--lineS)}

/* notices */
.note{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--tHead);font-size:calc(15px*var(--fs));align-items:flex-start;box-shadow:inset 0 0 0 1px var(--line)}
.note>.ic{margin-top:2px;color:var(--muted)}
.note.warn{background:var(--accTint2);box-shadow:inset 0 0 0 1px var(--accTint)}.note.warn>.ic{color:var(--accD)}
.note.err{background:var(--errT);box-shadow:none}.note.err>.ic{color:var(--err)}
.note.ok{background:var(--okT);box-shadow:none}.note.ok>.ic{color:var(--okD)}
.note b{display:block}
button.note{width:100%;text-align:left;transition:filter .12s}
button.note:hover{filter:brightness(.97)}
button.note .go{margin-left:auto;align-self:center;color:var(--muted2)}
.lock{display:inline-flex;align-items:center;gap:5px;font-size:calc(14px*var(--fs));font-weight:600;color:var(--muted2)}

/* timeline */
.tl{display:grid;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:9px;top:16px;bottom:0;width:2px;background:var(--lineS)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.tl .d{width:12px;height:12px;border-radius:50%;margin:4px 0 0 4px;background:var(--card);border:2px solid var(--muted2)}
.tl .d.ok{border-color:var(--ok);background:var(--ok)} .tl .d.away{border-color:var(--away);background:var(--away)} .tl .d.warn{border-color:var(--acc);background:var(--acc)} .tl .d.err{border-color:var(--err);background:var(--err)} .tl .d.ink{border-color:var(--ink);background:var(--ink)}

/* beds */
.beds{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bed{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);display:grid;gap:3px;min-height:62px;text-align:left;position:relative;overflow:hidden;transition:border-color .12s,box-shadow .12s}
.bed::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line2)}
.bed:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.bed[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bed .id{font-size:calc(13px*var(--fs));color:var(--ink)}
.bed span{font-size:calc(14px*var(--fs));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bed.occ::before{background:var(--ink)} .bed.free::before{background:var(--ok)} .bed.away::before{background:var(--away)} .bed.out::before{background:var(--err)} .bed.res::before{background:var(--acc)}
.bed.out{background:var(--errT)}
.bed.free span{color:var(--okD);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:calc(14px*var(--fs));color:var(--muted)}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* stepper (wizard) */
.wiz{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:6px;box-shadow:var(--sh1)}
.wz{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;text-align:left;min-width:0}
.wz:hover:not([disabled]){background:var(--hover)}
.wz[disabled]{cursor:not-allowed}
.wz .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 calc(15px*var(--fs)) var(--f-body);background:var(--tHead);color:var(--muted2);box-shadow:inset 0 0 0 1px var(--line2);flex:none}
.wz .t{display:grid;min-width:0;line-height:1.25}
.wz .t b{font-size:calc(15px*var(--fs));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz .t small{font-size:calc(14px*var(--fs));color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wz.done .n{background:var(--okS);color:var(--onOkS);box-shadow:none}
.wz.cur{background:var(--selT)}
.wz.cur .n{background:var(--ink);color:var(--card);box-shadow:none}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 13px var(--f-body)}
.chart rect.bar{transition:opacity .12s}
.chart g.col:hover rect.bar{opacity:.8}

/* drawer / modal / toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--card);z-index:31;box-shadow:var(--sh3);display:flex;flex-direction:column;animation:slide .2s ease-out;padding-top:env(safe-area-inset-top,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.drawer .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--lineS)}
.drawer .db{padding:18px 22px;overflow:auto;flex:1;display:grid;gap:16px;align-content:start}
.drawer .df{padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--lineS);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modalwrap{position:fixed;inset:0;z-index:31;display:grid;place-items:center;padding:16px;pointer-events:none}
.modal{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;box-shadow:var(--sh3);display:flex;flex-direction:column;max-height:90vh;animation:popin .15s}
.modal.wide{max-width:680px}
.modal .mh{padding:20px 22px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal .mb{padding:16px 22px;display:grid;gap:14px;overflow:auto}
.modal .mf{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--lineS)}
.toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;display:grid;gap:8px;width:max-content;max-width:calc(100% - 32px)}
.toast{background:#231F45;color:#fff;padding:10px 12px 10px 14px;border-radius:12px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:var(--sh3);animation:popin .15s}
.toast .ic{color:var(--acc)}
.toast button{color:var(--acc);font-weight:700;padding:2px 6px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.1)}

/* palette */
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);z-index:41;width:min(600px,calc(100% - 24px));background:var(--raise);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--sh3);overflow:hidden;animation:popin .12s}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--lineS)}
.palette .pin input{flex:1;border:0;background:none;outline:none;font-size:calc(17px*var(--fs));min-width:0}
.palette .res{max-height:min(420px,60vh);overflow:auto;padding:6px}
.palette .pf{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--lineS);font-size:calc(14px*var(--fs));color:var(--muted2)}

/* phone */
.phone{width:100%;max-width:380px;border-radius:40px;border:10px solid #231F45;background:var(--paper);overflow:hidden;margin-inline:auto;box-shadow:var(--sh3)}
.phone .ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.phone .body{padding:14px;display:grid;gap:12px;min-height:560px;align-content:start}
.phone .tabbar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}
.phone .tabbar button{display:grid;justify-items:center;gap:2px;padding:10px 4px 12px;font-size:calc(14px*var(--fs));color:var(--muted2);font-weight:600}
.phone .tabbar button[aria-selected="true"]{color:var(--ink)}
.phone .tabbar button[aria-selected="true"] .ic{color:var(--accD)}
.scanner{aspect-ratio:1/0.8;border-radius:18px;background:#17142F;position:relative;display:grid;place-items:center;color:#CBC8E0;font-size:calc(15px*var(--fs));max-width:100%;overflow:hidden}
.scanner .fr{position:absolute;inset:16% 22%;border:2px solid rgba(203,200,224,.5);border-radius:18px}
.scanner .ln{position:absolute;left:24%;right:24%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 14px var(--acc)}
@media (prefers-reduced-motion:no-preference){.scanner .ln{animation:scan 2.4s ease-in-out infinite alternate}@keyframes scan{from{top:20%}to{top:80%}}}

/* review */
.sev{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font:700 calc(14px*var(--fs)) var(--f-body);flex:none}
.sev.h{background:var(--errT);color:var(--err)} .sev.m{background:var(--accTint);color:var(--accD)} .sev.l{background:var(--tHead);color:var(--muted)}
.finding{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--lineS)}
.finding:first-of-type{border-top:0;padding-top:0}
.finding b{display:block;margin-bottom:2px}
.finding .where{font-size:calc(14px*var(--fs));color:var(--muted2);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.swatch{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;font-size:calc(15px*var(--fs))}
.swatch i{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}

.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:32px 16px;border:1.5px dashed var(--line2);border-radius:14px;color:var(--muted)}
.empty>.ic{width:28px;height:28px;color:var(--muted2)}
.dropzone{transition:background .12s,border-color .12s}
.dropzone:hover,.dropzone.over{background:var(--hover);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 18px}
.kv>div{display:grid;gap:2px;min-width:0}
.badgecard{border-radius:16px;background:#231F45;color:#fff;padding:18px;display:grid;gap:10px;max-width:320px;box-shadow:var(--sh3)}

.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1180px){.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.split,.split.list{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}

}

/* =========================================================
   ShelterSync v4 — operator CRM for shelter locations
   Data model follows the client's SharePoint lists:
   opdrachtgever, opdracht, locatie, locatiestatus, locatie_unit, locatie_wooneenheden,
   medewerker, medewerker_status (+ functie, soort_contract, werkgever),
   bewoner (+ doelgroep, nationaliteit), bewoner_woonstatus,
   actie/besluit/informatie (dagjournaal) (+ hoofdthema, subthema, onderwerp)
   ========================================================= */
const TODAY="2026-10-01", NOWT="14:52", CUR_WEEK=40, WK_START="2026-09-28", WK_END="2026-10-04";
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic = (n,c="") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const nf = n => n.toLocaleString("nl-NL");
const pct = (a,b,d=1) => b?(a/b*100).toLocaleString("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d}):"0";
const ini = n => n.split(" ").filter(w=>w[0]===w[0].toUpperCase()).map(x=>x[0]).join("").slice(0,2).toUpperCase()||n.slice(0,2).toUpperCase();
const T0=Date.now();
const now = () => { const [h,m]=NOWT.split(":").map(Number); const t=h*60+m+Math.floor((Date.now()-T0)/60000); return `${String(Math.floor(t/60)%24).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; };

/* trend chart: weekly open tasks / high incidents / open complaints */
const TRENDH={};

function trendChart(locs,n,id){
  const data=trendRows(locs,n); TRENDH[id]=data; const max=Math.max(4,...data.flatMap(d=>[d.tasks,d.hi,d.kl])); const top=Math.ceil(max/4)*4;
  const W=680,H=230,pl=34,pr=56,pt=14,pb=28; const x=i=>pl+i*(W-pl-pr)/(data.length-1), y=v=>pt+(top-v)/top*(H-pt-pb);
  const ser=[["tasks","var(--c1)",""],["hi","var(--c2)","6 4"],["kl","var(--c3)","2 3"]]; const path=k=>data.map((d,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join("");

    ${data.map((d,i)=>`<g class="col" data-twk="${id}:${i}"><rect x="${x(i)-(W-pl-pr)/(data.length-1)/2}" y="${pt}" width="${(W-pl-pr)/(data.length-1)}" height="${H-pt-pb}" fill="transparent"/><text x="${x(i)}" y="${H-8}" text-anchor="middle" ${d.w===CUR_WEEK?'style="fill:var(--ink);font-weight:700"':""}>wk ${d.w}</text></g>`).join("")}
    ${ser.map(([k,c,da])=>`<path d="${path(k)}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" ${da?`stroke-dasharray="${da}"`:""}/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[k])}" r="${i===data.length-1?4.5:3}" fill="${i===data.length-1?c:"var(--card)"}" stroke="${c}" stroke-width="1.6"/>`).join("")}<text x="${x(data.length-1)+10}" y="${y(data.at(-1)[k])+4}" style="fill:${c};font-weight:700">${data.at(-1)[k]}</text>`).join("")}

/* ---------- Taken ---------- */
V.taken = () => {
  const T=S.tk, m=me(); const base=ABI.filter(e=>visible(e)&&isTask(e));
  const sets={mijn:base.filter(e=>e.status!=="klaar"&&((e.voor?.k==="p"&&e.voor.v===m.id)||(e.voor?.k==="r"&&e.voor.v!=="teamlocatie"&&isMine(e)))),team:base.filter(e=>e.status!=="klaar"&&((e.voor?.k==="t"&&e.voor.v===m.team)||(e.voor?.k==="r"&&e.voor.v==="teamlocatie"&&isMine(e)))),vrij:base.filter(e=>e.status!=="klaar"&&!e.voor),alle:base.filter(e=>e.status!=="klaar"),klaar:base.filter(e=>e.status==="klaar")};
  const bv=S.role==="beveiliging"; if((!CAN.manager()&&T.tab==="alle")||(bv&&!["mijn","team"].includes(T.tab))) T.tab="mijn"; const q=T.q.toLowerCase();
  const list=(sets[T.tab]||[]).filter(e=>!q||(e.gevraagd+e.oms+e.id+assigneeName(e.voor)).toLowerCase().includes(q)).sort((a,b)=>T.tab==="klaar"?(b.gereed||"").localeCompare(a.gereed||""):PRIO[a.prio][2]-PRIO[b.prio][2]||(a.due||"9999").localeCompare(b.due||"9999"));
  const groups=T.tab==="klaar"?[["Afgerond",list]]:["hoog","middel","laag"].map(p=>[`Prioriteit ${PRIO[p][1].toLowerCase()}`,list.filter(e=>e.prio===p)]).filter(g=>g[1].length);
  return `<div class="phead"><div class="t">${locChip()}<h1>Taken</h1><p class="muted">Elke taak komt uit het dagjournaal (actie gewenst). Toegewezen aan een collega, een team of aan iedereen. Gesorteerd op prioriteit, daarna deadline.</p></div><div class="actions"><button class="btn pri" data-layer="modal:abi:task">${ic("plus")}${bv?"Nieuwe taak/melding":"Nieuwe taak"}</button></div></div>
  <div class="card flush"><div class="toolbar">${Seg("tk.tab",bv?[["mijn","Mijn taken",sets.mijn.length],["team",`Team ${TEAMS[m.team]?.n||""}`,sets.team.length]]:[["mijn","Mijn taken",sets.mijn.length],["team",`Team ${TEAMS[m.team]?.n||""}`,sets.team.length],["vrij","Voor iedereen",sets.vrij.length],...(CAN.manager()?[["alle","Alle open",sets.alle.length]]:[]),["klaar","Afgerond",sets.klaar.length]],{tabs:1,label:"Takenlijst"})}<div class="inpwrap sm" style="width:min(260px,100%)">${ic("search","s")}<input id="tkq" data-bind-live="tk.q" type="search" placeholder="Zoek taak of collega" value="${esc(T.q)}" aria-label="Taken zoeken"></div></div>

  <div class="tfoot"><span>${list.length} taken</span><span>Vakje = afronden · regel = details, reacties en overdragen</span></div></div>`;

/* ---------- Dagjournaal ---------- */
const JR_MONTHS=[["2026-10","Oktober 2026"],["2026-09","September 2026"],["2026-08","Augustus 2026"],["2026-07","Juli 2026"],["2026-06","Juni 2026"]];
const jrRow = e => `<tr class="click" data-abi="${e.id}"><td class="num" style="white-space:nowrap">${fd(e.date)}<div class="xs muted2">${e.time} · ${e.dienst}</div></td><td><span class="tag">${e.type}</span>${e.vertrouwelijk?` <span class="lock" title="Vertrouwelijk">${ic("lock","s")}</span>`:""}</td><td class="small">${esc(e.onderwerp)}</td><td>${M(e.by)?ini(M(e.by).naam):"—"}</td><td class="mono" style="color:var(--ink)">${e.we?WEof(e.we)?.nr||"—":"—"}${S.loc==="all"?`<div class="xs muted2" style="font-family:var(--f-body)">${LOC(e.loc).naam}</div>`:""}</td><td class="wrap small">${esc(e.oms)}</td><td><span class="tag">${esc(e.sub)}</span><div class="xs muted2" style="margin-top:3px">${esc(e.hoofd)}</div></td><td class="wrap small">${isTask(e)?`${esc(e.gevraagd)}<div class="row" style="gap:6px;margin-top:4px">${whoChip(e.voor)}${dueChip(e)}</div>`:`<span class="muted2">—</span>`}</td><td><span class="lgprio ${e.prio}">${PRIO[e.prio][1]}</span></td></tr>`;

    body=`<div class="card flush"><div class="toolbar"><div class="row"><div style="width:180px">${Sel("jr.month",JR_MONTHS.map(([v,t])=>({v,t,m:String(base.filter(e=>e.date.startsWith(v)).length)})),{sm:1,label:"Maand"})}</div><div style="width:230px">${Sel("jr.hoofd",[{v:"all",t:"Alle hoofdthema's"},...REF.hoofdthema.map(t=>({v:t,t,m:String(base.filter(e=>e.hoofd===t&&e.date.startsWith(J.month)).length)}))],{sm:1,label:"Hoofdthema"})}</div>${Seg("jr.type",[["all","Alle"],["Actie","Actie"],["Besluit","Besluit"],["Informatie","Informatie"]],{label:"Type"})}${Seg("jr.prio",[["all","Alle"],["hoog","Hoog"],["middel","Middel"],["laag","Laag"]],{label:"Prioriteit"})}</div><div class="inpwrap sm" style="width:min(220px,100%)">${ic("search","s")}<input id="jrq" data-bind-live="jr.q" type="search" placeholder="Zoek in omschrijving" value="${esc(J.q)}" aria-label="Dagjournaal doorzoeken"></div></div>
    <div class="tw"><table><thead><tr><th>Datum</th><th>Type</th><th>Onderwerp</th><th>Door</th><th>Eenheid</th><th>Omschrijving</th><th>Thema</th><th>Actie</th><th>Prio</th></tr></thead><tbody>${rows.length?rows.map(jrRow).join(""):`<tr><td colspan="9" style="padding:20px">${empty("log","Geen registraties","Geen registraties voor deze maand en filters.",`<button class="btn sm" data-layer="modal:abi:new">Nieuwe registratie</button>`)}</td></tr>`}</tbody></table></div>
    <div class="tfoot"><span>${rows.length} registraties</span><span>${ic("lock","s")} vertrouwelijk: alleen woonbegeleiding en management</span></div></div>`; }
  else { const from=addDays(TODAY,-30*J.range); const rows=base.filter(e=>e.date>=from); const months=JR_MONTHS.slice().reverse().filter(([m])=>m>=from.slice(0,7));
    const byType=["Actie","Besluit","Informatie"].map(t=>[t,rows.filter(e=>e.type===t).length]); const byOnd=REF.onderwerp.map(o=>[o,rows.filter(e=>e.onderwerp===o).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);

      <div class="card kpi"><span class="eyebrow">Hoge prioriteit</span><div class="v">${hi}</div><span class="small muted">${pct(hi,rows.length)}% van alle registraties</span></div>

  <div class="row between">${Seg("md.tab",[["open","Open",base.filter(x=>x.status!=="klaar").length],["klaar","Afgehandeld",base.filter(x=>x.status==="klaar").length]],{tabs:1,cls:"lg",label:"Status"})}<div class="inpwrap sm" style="width:220px">${ic("search","s")}<input id="mdq" data-bind-live="md.q" type="search" placeholder="Zoek incident" value="${esc(Mx.q)}" aria-label="Zoeken"></div></div>

/* shared detail panel for an ABI record (incidents, complaints) */

  <h2 style="font-size:20px;margin-top:-6px">${esc(e.sub)}${e.we?` · ${WEof(e.we)?.nr||""}`:""}</h2>`}<p>${esc(e.oms)}</p>
  <div class="kv"><div><span class="eyebrow">Type · onderwerp</span><span>${e.type} · ${e.onderwerp}</span></div><div><span class="eyebrow">Hoofdthema</span><span>${esc(e.hoofd)}</span></div><div><span class="eyebrow">Gemeld</span><span>${fdateLong(e.date)} ${e.time} · ${e.dienst}</span></div><div><span class="eyebrow">Door</span><span>${M(e.by)?.naam||"—"}</span></div>${r?`<div><span class="eyebrow">Bewoner</span>${resLink(r.id)}</div>`:""}${e.contact?`<div><span class="eyebrow">Contact</span><span>${esc(e.contact)}</span></div>`:""}${e.vertrouwelijk?`<div><span class="eyebrow">Zichtbaarheid</span><span class="lock">${ic("lock","s")}Vertrouwelijk</span></div>`:""}</div>
  ${isTask(e)?`<div class="note ${e.status==="klaar"?"ok":""}">${ic(e.status==="klaar"?"check":"flag")}<div><b>${e.status==="klaar"?"Afgerond":"Actie gevraagd"}</b><span class="small">${esc(e.gevraagd)}</span><div class="row" style="gap:6px;margin-top:6px">${whoChip(e.voor)}${dueChip(e)}</div>${e.genomen?`<span class="small" style="display:block;margin-top:6px"><b>Genomen:</b> ${esc(e.genomen)}${e.resultaat?` · ${esc(e.resultaat)}`:""}</span>`:""}</div></div>`:""}

  ${canEdit&&e.status!=="klaar"?`<div class="field"><label for="cmt-${e.id}">Reactie toevoegen</label><textarea id="cmt-${e.id}" class="inp" data-bind="f.cmt" placeholder="Wat heb je gedaan of gezien?">${esc(S.f.cmt||"")}</textarea></div>
  <div class="row between" style="border-top:1px solid var(--lineS);padding-top:14px"><div class="row"><button class="btn" data-act="abiComment" data-id="${e.id}">Reactie plaatsen</button>${isTask(e)&&mine?`<button class="btn ghost" data-layer="modal:handover:${e.id}">${ic("send")}Overdragen</button>`:""}${CAN.manager()&&!isTask(e)?`<button class="btn ghost" data-layer="modal:maketask:${e.id}">${ic("plus")}Actie uitzetten</button>`:""}</div>${isTask(e)?(e.status==="open"&&(!e.voor||e.voor.k==="t"||mine)?`<button class="btn pri" data-act="abiTake" data-id="${e.id}">Oppakken</button>`:mine?`<button class="btn pri" data-layer="modal:done:${e.id}">${ic("check")}Afronden</button>`:""):""}</div>`:e.status==="klaar"&&canEdit?`<div class="row" style="justify-content:flex-end"><button class="btn" data-act="abiReopen" data-id="${e.id}">${ic("undo")}Heropenen</button></div>`:""}</div>`; }

};

/* ---------- Bewoners ---------- */
V.bewoners = () => {
  const W=S.bw; const locs=curLocs(); const all=BEWONERS.filter(b=>{ const w=wsOf(b.id); return w&&locOk(w.loc); });
  const counts={actief:all.filter(b=>wsOf(b.id).status==="Actief").length,aangemeld:all.filter(b=>wsOf(b.id).status==="Aangemeld").length,vertrokken:all.filter(b=>!["Actief","Aangemeld"].includes(wsOf(b.id).status)).length};
  const q=W.q.toLowerCase(); let rows=all.filter(b=>{ const s=wsOf(b.id).status; const ok=W.tab==="actief"?s==="Actief":W.tab==="aangemeld"?s==="Aangemeld":s!=="Actief"&&s!=="Aangemeld"; return ok&&(W.dg==="all"||b.doelgroep===W.dg)&&(!q||(b.naam+b.id+(WEof(wsOf(b.id).we)?.nr||"")).toLowerCase().includes(q)); });
  rows.sort((a,b)=>(W.sort==="naam"?a.achternaam.localeCompare(b.achternaam):W.sort==="we"?(wsOf(a.id).we||"~").localeCompare(wsOf(b.id).we||"~"):W.sort==="geb"?a.geb.localeCompare(b.geb):wsOf(a.id).sinds.localeCompare(wsOf(b.id).sinds))*W.dir);
  const sh=(k,l)=>`<button type="button" data-sort="${k}">${l}${W.sort===k?`<span style="display:inline-block;transform:rotate(${W.dir>0?0:180}deg)">${ic("chev","s")}</span>`:ic("updown","s")}</button>`;
  return `<div class="phead"><div class="t">${locChip()}<h1>Bewoners</h1><p class="muted">${counts.actief} bewoners in ${HH.filter(h=>!h.left&&!h.pending&&locs.includes(h.loc)).length} huishoudens. ${CAN.residentsEdit()?"Je kunt gegevens wijzigen, verhuizen en uitschrijven.":"Alleen-lezen; wijzigingen doet een senior woonbegeleider of manager."}</p></div><div class="actions">${CAN.residentsEdit()?`<button class="btn" data-layer="modal:export:bewoners">${ic("download")}Exporteren</button><button class="btn pri" data-layer="modal:newres">${ic("plus")}Bewoner aanmelden</button>`:""}</div></div>
  <div class="card flush"><div class="toolbar">${Seg("bw.tab",[["actief","Actief",counts.actief],["aangemeld","Aangemeld",counts.aangemeld],["vertrokken","Vertrokken",counts.vertrokken]],{tabs:1,label:"Status"})}<div class="tb-right"><div class="inpwrap sm tb-search">${ic("search","s")}<input id="bwq" data-bind-live="bw.q" type="search" placeholder="Zoek op naam, nummer of eenheid" value="${esc(W.q)}" aria-label="Bewoners zoeken"></div><div class="tb-filter">${Sel("bw.dg",[{v:"all",t:"Alle doelgroepen"},...REF.doelgroep.map(d=>({v:d,t:d,m:String(all.filter(b=>b.doelgroep===d&&wsOf(b.id).status==="Actief").length)}))],{sm:1,label:"Doelgroep"})}</div>${W.dg!=="all"||W.q?`<button class="btn sm ghost" data-act="bwClear">${ic("x","s")}Wis filters</button>`:""}</div></div>
  <div class="tw"><table><thead><tr><th>${sh("naam","Bewoner")}</th><th>${sh("geb","Leeftijd")}</th><th>Doelgroep</th><th>${sh("we","Eenheid")}</th><th>Huishouden</th><th>${sh("sinds","Sinds")}</th><th>Status</th><th></th></tr></thead><tbody>
  ${rows.length?rows.slice(0,120).map(b=>{const w=wsOf(b.id),h=HHof(b.id),we=WEof(w.we);return `<tr class="click" data-open-res="${b.id}"><td><div class="person">${resAv(b)}<div><b>${b.naam}</b><span class="id">${b.id} · ${b.nat}</span></div></div></td><td class="num">${age(b.geb)}${age(b.geb)<18?` <span class="tag">kind</span>`:""}</td><td class="small"><span class="trunc" title="${esc(b.doelgroep)}">${b.doelgroep}</span></td><td>${S.loc==="all"?`<span class="small">${LOC(w.loc).naam}</span> `:""}${we?`<span class="mono" style="color:var(--ink)">${we.nr}</span>`:`<span class="muted2">—</span>`}</td><td class="small">${h?`${h.leden.length>1?`${h.leden.length} personen`:"Alleenstaand"}${w.hoofd?"":`<div class="xs muted2" style="white-space:nowrap">hoofd: ${B(w.hoofdId)?.voornaam||""}</div>`}`:"—"}</td><td class="num muted small" style="white-space:nowrap">${fd(w.sinds)}<div class="xs muted2">${w.sinds.slice(0,4)}</div></td><td>${pill(w.status==="Actief"?"p-ok":w.status==="Aangemeld"?"p-warn":"p-n",w.status)}</td><td class="r" style="width:52px">${CAN.residentsEdit()?`<button type="button" class="iconbtn" data-menu="resRow" data-arg="${b.id}" aria-label="Acties" aria-haspopup="menu">${ic("dots")}</button>`:ic("chevr","s muted2")}</td></tr>`}).join(""):`<tr><td colspan="8" style="padding:20px">${empty("search","Geen bewoners gevonden","Pas de filters aan.")}</td></tr>`}
  </tbody></table></div><div class="tfoot"><span>${Math.min(rows.length,120)} van ${rows.length} getoond</span><span>Klik op een rij voor het dossier</span></div></div>`;
};

/* ---------- Dossier ---------- */
V.dossier = () => {
  const b=B(S.selRes); if(!b) return V.bewoners(); const w=wsOf(b.id), h=HHof(b.id), we=WEof(w.we), l=LOC(w.loc); const t=S.dos.tab; const hist=WOONSTATUS.filter(x=>x.bewoner===b.id); const notes=ABI.filter(e=>e.res===b.id&&visible(e));
  const body = t==="overzicht"?`<div class="split"><div class="stack"><div class="card"><div class="ch"><h2>Persoon</h2>${CAN.residentsEdit()?`<button class="link small" data-layer="drawer:editres:${b.id}">Wijzigen</button>`:`<span class="lock">${ic("lock","s")}Alleen-lezen</span>`}</div><div class="kv"><div><span class="eyebrow">Geboortedatum</span><span>${fdate(b.geb)} (${age(b.geb)})</span></div><div><span class="eyebrow">Geslacht</span><span>${b.geslacht==="M"?"Man":"Vrouw"}</span></div><div><span class="eyebrow">Nationaliteit</span><span>${b.nat}</span></div><div><span class="eyebrow">Doelgroep</span><span>${b.doelgroep}</span></div><div><span class="eyebrow">Talen</span><span>${b.talen.join(", ")}</span></div><div><span class="eyebrow">Telefoon</span><span>${b.tel||"—"}</span></div><div><span class="eyebrow">E-mail</span><span>${b.email||"—"}</span></div><div><span class="eyebrow">Noodnummer</span><span>${b.nood?`${b.nood} (${b.noodRel})`:"—"}</span></div></div></div>
    <div class="card"><div class="ch"><h2>Wonen</h2></div><div class="kv"><div><span class="eyebrow">Locatie</span><button class="link" data-goto="locatie:${l.id}">${l.naam}</button></div><div><span class="eyebrow">Wooneenheid</span>${we?`<button class="link" data-layer="drawer:we:${we.id}">${we.nr} · ${we.type}</button>`:`<span>Nog geen eenheid</span>`}</div><div><span class="eyebrow">Woont hier sinds</span><span>${fdate(w.sinds)}</span></div><div><span class="eyebrow">Via ${ORG.short} sinds</span><span>${fdate(w.viaSinds)}</span></div><div><span class="eyebrow">Wooncontract</span><span>${w.contract?"Ja":"Nee"}</span></div><div><span class="eyebrow">Hoofdbewoner</span><span>${w.hoofd?"Ja":`Nee · ${B(w.hoofdId)?.naam||"?"}`}</span></div></div>
    ${h&&h.leden.length>1?`<div class="eyebrow" style="margin:14px 0 8px">Huishouden · ${h.leden.length} personen</div><div class="row" style="gap:6px">${h.leden.filter(id=>id!==b.id).map(id=>`<button type="button" class="asg" data-open-res="${id}">${resAv(B(id),"sm")}${B(id).naam} (${age(B(id).geb)})</button>`).join("")}</div>`:""}</div></div>
    <div class="stack">${w.status==="Tijdelijk afwezig"&&w.afwezig?`<div class="note warn">${ic("cal")}<div><b>Tijdelijk afwezig ${fd(w.afwezig.van)} t/m ${fd(w.afwezig.tot)}</b><span class="small">${esc(w.afwezig.reden)}${w.afwezig.toel?` · ${esc(w.afwezig.toel)}`:""}. Eenheid blijft gereserveerd; meldplicht telt niet mee.</span></div></div>`:""}${b.care?`<div class="note warn">${ic("info")}<div><b>Let op bij plaatsing: ${b.care}</b><span class="small">Alleen de categorie. Details staan bij de zorgpartner.</span></div></div>`:""}
    <div class="card"><div class="ch"><h2>Documenten</h2><span class="lock">${ic("lock","s")}${CAN.residentsEdit()?"Senior en management":"Alleen-lezen"}</span></div>${b.docs.length?`<div class="stack tight">${b.docs.map(d=>`<div class="ccard" style="cursor:default">${ic("file")}<span class="ct"><b>${d}</b><small>PDF · geüpload ${fdate(w.sinds)}</small></span></div>`).join("")}</div>`:`<p class="small muted">Geen documenten.</p>`}${CAN.residentsEdit()?`<button class="btn sm" style="margin-top:10px" data-act="toastOnly" data-msg="Upload (prototype)">${ic("upload")}Document toevoegen</button>`:""}</div>
    <div class="card"><div class="ch"><h2>Privacy</h2><span class="lock">${ic("shield","s")}AVG</span></div><div class="row between"><span class="small">Bewaartermijn na vertrek</span><b>12 maanden</b></div><div class="row between"><span class="small">Laatst bekeken door</span><span class="small">${me().naam}, vandaag</span></div></div></div></div>`
  : t==="historie"?`<div class="card flush"><div class="ch"><h2>Woonhistorie</h2><span class="small muted">Elke statuswijziging wordt gelogd</span></div><div class="tw"><table><thead><tr><th>Van</th><th>Tot</th><th>Status</th><th>Locatie</th><th>Eenheid</th><th>Door</th><th>Reden</th></tr></thead><tbody>${hist.slice().reverse().map(x=>`<tr><td class="num">${fdate(x.sinds)}</td><td class="num">${x.tot?fdate(x.tot):"—"}</td><td>${pill(x.status==="Actief"?"p-ok":x.status==="Aangemeld"?"p-warn":"p-n",x.status)}</td><td>${LOC(x.loc)?.naam||"—"}</td><td class="mono" style="color:var(--ink)">${x.we?(WEof(x.we)?.nr||x.we.split(":")[1]):"—"}</td><td class="small">${x.by||"—"}</td><td class="small">${esc(x.reason||"")}</td></tr>`).join("")}</tbody></table></div></div>`

};

/* ---------- Aanwezigheid ---------- */
/* Week cell: green = gemeld, red = niet gemeld. Digits only for residents under strict control. */
const wkCell = (b,w) => { const s=weekState(b,w), c=weekCount(b,w), strict=!!STRICT[b.id];
  if(s==="na") return `<span class="wk na" title="Week ${w}: nog niet woonachtig"></span>`;
  if(strict) return `<span class="wk ${s==="ok"?"ok":s==="cur"?"miss cur":"red"}" title="Week ${w}: ${c} dag(en) gemeld">${c}</span>`;
  if(s==="ok") return `<span class="wk ok" title="Week ${w}: gemeld">${ic("check","s")}<span class="sr">gemeld</span></span>`;
  if(s==="cur") return `<span class="wk miss cur" title="Week ${w}: nog niet gemeld, week loopt nog"><span class="sr">week loopt nog</span></span>`;
  return `<span class="wk red" title="Week ${w}: niet gemeld">${ic("x","s")}<span class="sr">niet gemeld</span></span>`; };
V.aanwezigheid = () => {
  const P=S.pr; const ppl=presPeople(S.loc==="all"?"all":S.loc).filter(b=>locOk(wsOf(b.id).loc)); const can=CAN.strict(); const firstWeek=isoWeek(CFG.dataStart); const n=P.range==="all"?CUR_WEEK-firstWeek+1:+P.range; const weeks=[...Array(n)].map((_,i)=>CUR_WEEK-n+1+i);
  const dec=ppl.filter(needsDecision), strict=ppl.filter(b=>STRICT[b.id]); const state=b=>needsDecision(b)?"dec":STRICT[b.id]?"strict":"ok"; const q=P.q.toLowerCase(); const rows=ppl.filter(b=>(P.f==="all"||state(b)===P.f)&&(!q||(b.naam+b.id).toLowerCase().includes(q))); const lab={dec:["p-warn","Beslissing nodig"],strict:["p-away","Strenge controle"],ok:["p-ok","Voldoet"]};
  return `<div class="phead"><div class="t">${locChip()}<h1>Aanwezigheid</h1><p class="muted">Meldplicht: minimaal ${CFG.minPerWeek}× per week melden (scan bij de poort of handmatig door een medewerker). Na ${CFG.flagWeeks} weken op rij zonder melding beslist de locatiemanager over strengere controle. Kinderen tellen niet mee.</p></div><div class="actions">${can?`<button class="btn" data-go="instellingen">${ic("wrench")}Regels</button>`:""}<button class="btn" data-layer="modal:export:aanwezigheid">${ic("download")}Exporteren</button></div></div>
  ${dec.length?`<div class="card"><div class="ch"><div><h2>Beslissing nodig</h2><p class="small muted">${CFG.flagWeeks} of meer weken op rij niet gemeld</p></div>${pill("p-warn",dec.length)}</div><div class="grid g2" style="gap:12px">${dec.map(b=>{const w=wsOf(b.id);return `<div class="ccard" style="cursor:default;flex-direction:column;gap:10px"><div class="row between" style="width:100%"><div class="person">${resAv(b)}<div><b>${b.naam}</b><span class="xs muted">${b.id} · ${LOC(w.loc).naam} ${WEof(w.we)?.nr||""}</span></div></div>${CAN.residentsView()?`<button class="link small" data-open-res="${b.id}">Dossier</button>`:""}</div><div class="row" style="gap:4px">${[...Array(4)].map((_,i)=>wkCell(b,CUR_WEEK-3+i)).join("")}</div><span class="small">Week ${CUR_WEEK-missStreak(b)}–${CUR_WEEK-1} niet gemeld. Laatste melding: ${lastCheckin(b)?fdateLong(lastCheckin(b)):"onbekend"}.</span>${can?`<div class="row"><button class="btn sm dark" data-layer="modal:strict:${b.id}">Strengere controle aanzetten</button><button class="btn sm" data-layer="modal:nostrict:${b.id}">Niet nodig</button></div>`:`<span class="xs muted2">${ic("lock","s")} De locatiemanager beslist; je krijgt bericht.</span>`}</div>`}).join("")}</div></div>`:""}
  ${strict.length?`<div class="card"><div class="ch"><div><h2>Strenge controle</h2><p class="small muted">Dagelijks melden vóór ${CFG.strictBy}, laatste 7 dagen.${CFG.notifyWb?" Woonbegeleiders krijgen bericht bij een gemiste dag.":""}</p></div><div class="legend"><span><i style="background:var(--ok)"></i>Gemeld</span><span><i style="background:var(--away)"></i>Niet gemeld</span><span><i style="background:var(--line2)"></i>Verlof of nog open</span></div></div><div class="stack tight">${strict.map(b=>`<div class="row between" style="padding:8px 0;border-top:1px solid var(--lineS)"><div class="person">${resAv(b)}<div><b>${b.naam}</b><span class="xs muted">${LOC(wsOf(b.id).loc).naam} · sinds ${fdateLong(STRICT[b.id].since)} · door ${STRICT[b.id].by}</span></div></div><div class="row" style="gap:4px">${strictDays(b,7).map(x=>`<span class="dd ${x.s}" title="${fdateLong(x.d)}">${new Date(x.d+"T12:00").toLocaleDateString("nl-NL",{weekday:"short"}).slice(0,2)}</span>`).join("")}</div>${can?`<button class="btn sm ghost" data-act="strictOff" data-id="${b.id}">Uitzetten</button>`:""}</div>`).join("")}</div></div>`:""}
  <div class="card flush"><div class="toolbar"><div class="row">${Seg("pr.f",[["all","Alle",ppl.length],["dec","Beslissing nodig",dec.length],["strict","Strenge controle",strict.length],["ok","Voldoet",ppl.filter(b=>state(b)==="ok").length]],{tabs:1,label:"Filter"})}</div><div class="row">${Seg("pr.range",[["4","4 weken"],["12","12 weken"],["all","Alles"]],{label:"Periode"})}<div class="inpwrap sm" style="width:180px">${ic("search","s")}<input id="prq" data-bind-live="pr.q" type="search" placeholder="Zoek bewoner" value="${esc(P.q)}" aria-label="Zoeken"></div></div></div>
  <div class="tw"><table><thead><tr><th>Bewoner</th><th>Status</th>${weeks.map(w=>`<th style="text-align:center">wk ${w}<div style="font-weight:500;text-transform:none;letter-spacing:0">${fd(weekStart(w))}</div></th>`).join("")}<th>Laatste melding</th></tr></thead><tbody>
  ${rows.slice(0,80).map(b=>`<tr class="click" data-open-res="${b.id}"><td><div class="person">${resAv(b)}<div><b>${b.naam}</b><span class="id">${b.id}${S.loc==="all"?" · "+LOC(wsOf(b.id).loc).naam:""}</span></div></div></td><td>${pill(lab[state(b)][0],lab[state(b)][1])}</td>${weeks.map(w=>`<td style="text-align:center">${wkCell(b,w)}</td>`).join("")}<td class="small">${lastCheckin(b)?fdateLong(lastCheckin(b)):"—"}</td></tr>`).join("")}
  </tbody></table></div><div class="tfoot"><div class="legend"><span><i style="background:var(--ok)"></i>Gemeld</span><span><i style="background:var(--err)"></i>Niet gemeld</span><span><i style="background:var(--line2)"></i>Week loopt nog</span><span>Cijfer = dagen gemeld, alleen bij strenge controle</span></div><span>${Math.min(rows.length,80)} van ${rows.length} · gegevens sinds ${fdateLong(CFG.dataStart)}</span></div></div>
  ${PRESDEC.length?`<div class="card flush"><div class="ch"><h2>Eerdere beslissingen</h2></div><div class="tw"><table><thead><tr><th>Datum</th><th>Bewoner</th><th>Beslissing</th><th>Reden</th><th>Door</th></tr></thead><tbody>${PRESDEC.filter(d=>locOk(wsOf(d.res).loc)).slice().reverse().map(d=>`<tr><td class="num">${fdate(d.date)}</td><td>${B(d.res).naam}</td><td>${d.dec==="strict"?pill("p-away","Strenge controle"):d.dec==="off"?pill("p-n","Uitgezet"):pill("p-n","Niet nodig")}</td><td class="small">${esc(d.reason)}</td><td class="small">${d.by}</td></tr>`).join("")}</tbody></table></div></div>`:""}`;
};

/* ---------- Meldplichtscanner ---------- */

          ${done?`<div class="m-state"><span class="m-ico">${ic("check")}</span><div><b>Vandaag al gemeld</b><span>${lastScan(who.id)?"om "+lastScan(who.id)+" · ":""}opnieuw registreren is niet nodig</span></div></div>`
            :needsDecision(who)?`<div class="m-state"><span class="m-ico">${ic("alert")}</span><div><b>${missStreak(who)} weken niet gemeld</b><span>Registreer de melding; begeleiding krijgt bericht</span></div></div>`
            :STRICT[who.id]?`<div class="m-state"><span class="m-ico">${ic("clock")}</span><div><b>Strenge controle</b><span>Elke dag melden vóór ${CFG.strictBy}</span></div></div>`
            :`<div class="m-state"><span class="m-ico">${ic("info")}</span><div><b>Nog niet gemeld vandaag</b><span>Controleer de persoon en registreer</span></div></div>`}
          ${done?`<button class="m-btn sec" data-scantab="scan" data-next="1">${ic("scan")}Volgende badge</button>`:`<button class="m-btn" data-scan="in">${ic("check")}Melding registreren</button>`}
        </div>`;

  }
  else if(SC.tab==="zoek"){ const q=SC.q.toLowerCase(); const list=ppl.filter(b=>!q||(b.naam+b.id+unitOf(b)).toLowerCase().includes(q));
    screen=`<label class="m-search">${ic("search")}<input id="scq" data-bind-live="scan.q" placeholder="Naam, nummer of eenheid" value="${esc(SC.q)}" aria-label="Bewoner zoeken"></label>

  else screen=`<div class="m-sum"><div><b>${todayIn}</b><span>van ${ppl.length} gemeld</span></div><div class="m-ring" style="--p:${pct}"><span>${pct}%</span></div></div>
    <div class="m-list">${GATE.slice(0,8).map(g=>{const b=B(g.res); return `<div class="m-row">${b?face(b):""}<span class="m-rt"><b>${b?.naam||""}</b><small>${g.how}${g.queued?" · wacht op verbinding":""}</small></span><span class="m-time">${g.t}</span></div>`;}).join("")}</div>`;
  const phone=`<div class="mphone"><div class="m-status"><span>${now()}</span><span class="m-island"></span><span class="m-sig">${ic(S.offline?"wifioff":"wifi")}<i class="m-bat"></i></span></div>
    <div class="m-app"><div class="m-head"><div><span class="m-loc"><i class="${S.offline?"off":""}"></i>${LOC(loc).naam} · Poort 1</span><h3>${mtitle}</h3></div>${avatar(me().naam,"sm")}</div>

/* ---------- Opdrachtgevers & opdrachten ---------- */
V.opdrachtgevers = () => {

  const progress=p=>{ const end=p.verlengd||p.eind; const tot=Math.max(1,dayDiff(end,p.start)); const done=Math.min(tot,Math.max(0,dayDiff(TODAY,p.start))); return Math.round(done/tot*100); };

      <div class="opdfacts"><div><span class="eyebrow">Looptijd</span><span class="num">${fdate(p.start)} – ${fdate(p.eind)}</span>${p.verlengd?`<span class="xs muted2">verlengd tot ${fdate(p.verlengd)}</span>`:""}</div><div><span class="eyebrow">Verlenging</span><span>${p.verl?`${p.verl}× ${p.termijn} maanden`:"Geen"}</span></div><div><span class="eyebrow">Doelgroep</span><span>${esc(p.doelgroep)}</span></div><div><span class="eyebrow">Locatie</span>${l?`<span class="link" data-goto="locatie:${l.id}">${l.naam}</span>`:"<span>—</span>"}</div><div><span class="eyebrow">Waarde</span><span>${esc(p.waarde)}</span></div></div>
      <div class="opdbar" role="img" aria-label="${progress(p)}% van de looptijd verstreken"><i style="width:${progress(p)}%"></i></div><div class="row between xs muted2"><span>${fd(p.start)}</span><span>${progress(p)}% verstreken</span><span>${fd(end)}</span></div></button>`; };
  return `<div class="phead"><div class="t"><span class="lochead">${ic("file","s")}${ORG.name}</span><h1>Opdrachtgevers & opdrachten</h1><p class="muted">${OPDRACHTGEVERS.length} opdrachtgevers, ${OPDRACHTEN.length} opdrachten. Alleen regio- en locatiemanagers kunnen dit wijzigen.</p></div><div class="actions"><button class="btn" data-layer="modal:newopd">${ic("plus")}Opdracht</button><button class="btn pri" data-layer="modal:newog">${ic("plus")}Opdrachtgever</button></div></div>
  <div class="ogsplit"><div class="card flush oglist"><div class="ch" style="padding-bottom:10px"><h2>Opdrachtgevers</h2><span class="small muted">${OPDRACHTGEVERS.length}</span></div>${OPDRACHTGEVERS.map(o=>{const ps=OPDRACHTEN.filter(p=>p.og===o.id);const ls=LOCS.filter(l=>ps.some(p=>p.id===l.opd));return `<button type="button" class="ogitem" data-ogsel="${o.id}" aria-current="${o.id===sel}"><span class="ogav">${ic("building","s")}</span><span class="ogt"><b>${o.naam}</b><small>${ls.map(l=>l.naam).join(", ")||"Nog geen locatie"}</small></span><span class="tag">${ps.length}</span></button>`}).join("")}</div>

    <div class="ctgrid">${ct("user","Contactpersoon",esc(og.contact))}${ct("phone","Telefoon",`<a class="link" href="tel:${og.tel.replace(/\s/g,"")}">${og.tel}</a>`)}${ct("mail","E-mail",`<a class="link brk" href="mailto:${og.email}">${og.email}</a>`)}${ct("map","Postadres",`${og.adres}<br>${og.postcode} ${og.plaats}`)}${ct("arrow","Website",`<a class="link brk" href="${og.web}" target="_blank" rel="noopener">${og.web.replace("https://","")}</a>`)}</div></div>
    <div class="card flush"><div class="ch"><h2>Opdrachten</h2><span class="small muted">${opds.length}</span></div><div class="opdlist">${opds.map(opdCard).join("")||`<div style="padding:16px">${empty("file","Nog geen opdrachten","")}</div>`}</div></div></div></div>`;

    const rows=list.map(v=>({v,n:use(v)[0]})).filter(r=>!q||r.v.toLowerCase().includes(q)).sort((a,b)=>b.n-a.n||a.v.localeCompare(b.v,"nl"));

  doStaff:el=>{ const f=S.f; const id=el.dataset.id; if(id==="new"){ f.err={vn:!f.vn.trim(),an:!f.an.trim()}; if(f.err.vn||f.err.an) return; const nid=addStaff({naam:`${f.vn.trim()} ${f.an.trim()}`,functie:f.functie,team:f.team,locs:[...f.locs],contract:f.contract,werkgever:f.werkgever,uren:[f.minUur,f.maxUur],talen:[...f.talen],start:TODAY,shift:null}); audit("Beheer",`Medewerker toegevoegd: ${M(nid).naam} (${FUNC(f.functie).rol})`); S.layer=null; toast(`${M(nid).naam} toegevoegd`); return; }

function myNotifs(){ const n=[]; const m=me();
  ABI.filter(e=>visible(e)&&isTask(e)&&e.status!=="klaar"&&e.due&&e.due<=TODAY&&(isMine(e)||(CAN.manager()&&e.due<TODAY))).slice(0,6).forEach(e=>n.push({t:(dayDiff(e.due,TODAY)<0?"Te laat: ":"Vandaag: ")+e.gevraagd,s:`${e.id} · ${assigneeName(e.voor)}`,k:dayDiff(e.due,TODAY)<0?"err":"warn",fn:()=>{S.f={};openLayer("drawer","abiview",e.id);}}));
  if(CAN.manager()) ABI.filter(e=>visible(e)&&e.status==="overgedragen"&&inWeek(e.date)).forEach(e=>n.push({t:`Overgedragen: ${e.gevraagd}`,s:e.log.at(-1).t,k:"warn",fn:()=>{S.f={};openLayer("drawer","abiview",e.id);}}));
  if(CAN.confidential()){ presPeople(S.loc==="all"?"all":S.loc).filter(b=>locOk(wsOf(b.id).loc)&&needsDecision(b)).forEach(b=>n.push({t:`${b.naam}: ${missStreak(b)} weken niet gemeld`,s:CAN.strict()?"Beslis over strengere controle":"Locatiemanager beslist",k:"warn",fn:()=>go("aanwezigheid")})); ABI.filter(e=>visible(e)&&e.onderwerp==="Klacht bewoner"&&e.status!=="klaar"&&klachtDue(e)<TODAY).forEach(e=>n.push({t:`Klacht ${e.id}: reactietermijn verlopen`,s:e.oms.slice(0,60),k:"err",fn:()=>{S.kl.tab="open";S.kl.sel=e.id;go("klachten");}})); }

  return n; }
function openNotifs(anchor){ const list=myNotifs(); const el=openPop(anchor,`<div class="row between" style="padding:6px 10px 8px"><b>Meldingen voor jou</b><button type="button" class="link small" data-readall>Alles gelezen</button></div><div class="sep"></div>${list.length?list.map((n,i)=>`<button type="button" class="opt" data-n="${i}"><span class="lead" style="background:var(--${n.k==="err"?"errT":n.k==="warn"?"accTint":"tHead"});color:var(--${n.k==="err"?"err":n.k==="warn"?"accD":"muted"})">${ic(n.k==="err"?"alert":n.k==="warn"?"clock":"info","s")}</span><span class="ot"><b>${esc(n.t)}</b><small>${esc(n.s)}</small></span>${ic("chevr","s muted2")}</button>`).join(""):`<div class="none">Geen nieuwe meldingen</div>`}`,{align:"right",label:"Meldingen"}); el.style.width="380px"; placePop(el,anchor,"right");

function openLocs(anchor){ const mine=myLocs(); const el=openPop(anchor,`${mine.length>1?`<button type="button" class="opt" data-loc2="all" aria-selected="${S.loc==="all"}"><span class="lead">${ic("map","s")}</span><span class="ot"><b>${ALL_LOC_ROLES.includes(S.role)?"Alle locaties":"Alle mijn locaties"}</b><small>${mine.filter(id=>locActive(LOC(id))).length} actieve locaties samen</small></span>${ic("check","ck s")}</button><div class="sep"></div>`:""}<div class="grp">Locaties</div>${LOCS.map(l=>{const dis=!mine.includes(l.id);const act=locActive(l);return `<button type="button" class="opt" data-loc2="${l.id}" aria-selected="${S.loc===l.id}" ${dis?'aria-disabled="true"':""}><span class="lead">${ic("building","s")}</span><span class="ot"><b>${l.naam}</b><small>${dis?"Niet aan jou toegewezen":act?`${l.type} · ${occ(l.id)}/${cap(l.id)} · ${staffAt(l.id).filter(onDuty).length} in dienst`:esc(l.status.at(-1).note||"Niet actief")}</small></span>${ic("check","ck s")}</button>`}).join("")}`,{label:"Locatie kiezen"});

function setLoc(c){ S.loc=c; S.layer=null; S.selLoc=null; if(S.view==="dossier") S.view="bewoners"; if(S.view==="locatie") S.view="locaties"; render(); window.scrollTo(0,0); toast(c==="all"?"Je ziet nu al je locaties samen":`Locatie: ${LOC(c).naam}`); }
function openPalette(){ closePop(false); const wrap=document.createElement("div"); wrap.innerHTML=`<div class="scrim" data-pclose></div><div class="palette" role="dialog" aria-label="Zoeken"><div class="pin">${ic("search")}<input id="palIn" placeholder="Zoek bewoner, eenheid, registratie, collega of pagina" autocomplete="off"><span class="kbd">esc</span></div><div class="res" id="palRes" role="listbox"></div><div class="pf"><span>↑↓ kiezen</span><span>↵ openen</span><span>esc sluiten</span></div></div>`; $("#poplayer").appendChild(wrap); const inp=$("#palIn"), res=$("#palRes"); let items=[];

    const staff=q&&CAN.staff()?MEDEWERKERS.filter(p=>p.naam.toLowerCase().includes(q)).slice(0,4).map(p=>({g:"Medewerkers",t:p.naam,d:FUNC(p.functie).rol,i:"key",a:()=>{S.f=FORM_INIT.staff(p.id);openLayer("drawer","staff",p.id);}})):[];
    const acts=[["Nieuwe registratie","log",()=>openL("modal","abi","new"),CAN.journalWrite()],["Nieuwe taak","plus",()=>openL("modal","abi","task"),CAN.journalWrite()],["Weergave: thema en leesbaarheid","eye",()=>openL("drawer","weergave"),true]].filter(a=>a[3]&&(!q||a[0].toLowerCase().includes(q))).map(a=>({g:"Acties",t:a[0],i:a[1],a:a[2]}));
    items=[...people,...wes,...abis,...staff,...acts,...pages].slice(0,16); let g=null; res.innerHTML=items.length?items.map((x,i)=>(x.g!==g?`<div class="grp">${g=x.g}</div>`:"")+`<button type="button" class="opt ${i===0?"act":""}" data-pi="${i}" role="option"><span class="lead">${ic(x.i,"s")}</span><span class="ot"><b>${esc(x.t)}</b>${x.d?`<small>${esc(x.d)}</small>`:""}</span>${ic("chevr","s muted2")}</button>`).join(""):`<div class="none">Geen resultaten voor “${esc(inp.value)}”.</div>`; };
  const close=()=>{ wrap.remove(); POP=null; }; const run=i=>{ const x=items[i]; if(!x) return; close(); x.a(); };
  POP={el:wrap,anchor:$("#cmdk"),onKey:e=>{ const opts=$$(".opt",res); let i=opts.findIndex(o=>o.classList.contains("act")); if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); opts[i]?.classList.remove("act"); i=(i+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length; opts[i]?.classList.add("act"); opts[i]?.scrollIntoView({block:"nearest"}); } if(e.key==="Enter"){ e.preventDefault(); run(+opts[i]?.dataset.pi); } }};
  inp.addEventListener("input",draw); res.addEventListener("click",e=>{const b=e.target.closest("[data-pi]"); if(b) run(+b.dataset.pi);}); wrap.querySelector("[data-pclose]").addEventListener("click",close); draw(); inp.focus(); }

function renderShell(){ const m=me(); const Rr=ROLES[S.role];

  $("#roles").innerHTML=Object.entries(ROLES).map(([k,r])=>`<button type="button" role="radio" aria-checked="${S.role===k}" data-role="${k}" data-fid="role:${k}">${r.label}</button>`).join("");

  $("#nav").innerHTML=NAV.map(g=>{const its=g.items.filter(i=>i.r.includes("*")||i.r.includes(S.role)); if(!its.length) return ""; return `<div class="navgrp"><span class="h">${g.h}</span>${its.map(i=>{const c=i.c?i.c():0; const cur=S.view===i.id||(S.view==="dossier"&&i.id==="bewoners")||(S.view==="locatie"&&i.id==="locaties"); return `<a class="nav" href="#${i.id}" data-go="${i.id}" data-fid="nav:${i.id}" ${cur?'aria-current="page"':""}>${ic(i.i)}<span>${i.t}</span>${c?`<span class="cnt">${c}</span>`:""}</a>`}).join("")}</div>`}).join("");
  $("#bellDot").hidden=S.notifRead||!myNotifs().length; $("#syncPill").className="syncpill hide-s"+(S.offline?" off":""); $("#syncPill").innerHTML=`<i></i>${S.offline?`Offline${S.queue?` · ${S.queue} wacht`:""}`:"Gesynchroniseerd"}`; }
function render(){ const a=document.activeElement; const fid=a?.dataset?.fid, aid=a?.id; const sel=a&&"selectionStart" in a?[a.selectionStart,a.selectionEnd]:null;
  if(!myLocs().includes(S.loc)&&S.loc!=="all") S.loc=myLocs()[0]; if(S.loc==="all"&&myLocs().length===1) S.loc=myLocs()[0];
  if(!allowed(S.view)) S.view=ROLES[S.role].home; renderShell(); $("#view").innerHTML=V[S.view](); renderLayer();
  const t=(fid&&$(`[data-fid="${CSS.escape(fid)}"]`))||(aid&&document.getElementById(aid)); if(t&&t!==document.body){ t.focus({preventScroll:true}); if(sel&&"setSelectionRange" in t){ try{t.setSelectionRange(...sel)}catch(_){} } } else if(S.layer){ $("#layer .drawer, #layer .modal")?.querySelector("input,textarea,button.sel,[data-closelayer].iconbtn")?.focus({preventScroll:true}); } }
function go(v){ closePop(false); S.layer=null; S.view=v; try{history.replaceState(null,"","#"+v)}catch(e){} $("#side").classList.remove("open"); render(); window.scrollTo(0,0); $("#view").focus({preventScroll:true}); }

document.addEventListener("pointerdown",e=>{ if(POP&&!POP.el.contains(e.target)&&!POP.anchor?.contains(e.target)&&!e.target.closest(".palette")) closePop(false); },true);
document.addEventListener("click",e=>{ const T0=s=>e.target.closest(s); const deep=T0("[data-goto]"); const T=s=>{ const x=T0(s); return deep&&x&&s==="[data-layer]"&&x.contains(deep)&&x!==deep?null:x; }; let el;
  if(T("[data-closelayer]")){ closeLayer(); return; }
  if(el=T("[data-multi]")){ if(POP?.anchor===el){ closePop(); return; } openMulti(el); return; }
  if(el=T("[data-sel]")){ if(POP?.anchor===el){ closePop(); return; } openSelect(el); return; }
  if(el=T("[data-date]")){ if(POP?.anchor===el){ closePop(); return; } openDate(el); return; }
  if(el=T("[data-menu]")){ e.stopPropagation(); if(POP?.anchor===el){ closePop(); return; } openMenu(el,el.dataset.menu,el.dataset.arg); return; }
  if(T("#cmdk")){ openPalette(); return; }
  if(el=T("#bellBtn")){ if(POP?.anchor===el){ closePop(); return; } openNotifs(el); return; }
  if(el=T("#userBtn")){ if(POP?.anchor===el){ closePop(); return; } openMenu(el,"user"); return; }

  if(T("#poplayer")) return;
  if((el=T("[aria-disabled='true']"))&&el.matches(".ccard")) return;
  if(el=T("[data-set]")){ const p=el.dataset.set, cur=get(p); set(p,typeof cur==="number"?+el.dataset.val:el.dataset.val); if(p==="locv.tab") S.locv.unit="all"; if(p.startsWith("ui.")) applyUI(); render(); return; }
  if(el=T("[data-toggle]")){ const s=get(el.dataset.toggle); const v=el.dataset.val; s.has(v)?s.delete(v):s.add(v); render(); return; }
  if(el=T("[data-flip]")){ set(el.dataset.flip,!get(el.dataset.flip)); render(); return; }

  if(el=T("[data-role]")){ S.role=el.dataset.role; S.layer=null; closePop(false); S.loc=S.role==="regio"||S.role==="gast"?"all":me().locs.find(l=>locActive(LOC(l)))||me().locs[0]; S.view=ROLES[S.role].home; S.selLoc=null; render(); window.scrollTo(0,0); return; }
  if(el=T("[data-go]")){ e.preventDefault(); go(el.dataset.go); return; }

  if(el=T("[data-goto]")){ const [v,a]=el.dataset.goto.split(":"); if(v==="taken") S.tk.tab=a==="alle"&&!CAN.manager()?"mijn":a; if(v==="meldingen"){ S.md.tab="open"; } if(v==="klachten") S.kl.tab="open"; if(v==="locatie"){ S.selLoc=a; S.locv.tab="units"; S.locv.unit="all"; } if(v==="opdrachtgevers") S.og.sel=a; go(v); return; }
  if(el=T("[data-layer]")){ const [type,name,...rest]=el.dataset.layer.split(":"); openL(type,name,rest.join(":")); return; }

  if(el=T("[data-abi]")){ S.f={}; openLayer("drawer","abiview",el.dataset.abi); return; }
  if(el=T("[data-sort]")){ const k=el.dataset.sort; S.bw.dir=S.bw.sort===k?-S.bw.dir:1; S.bw.sort=k; render(); return; }
  if(el=T("[data-msel]")){ S.md.sel=el.dataset.msel; S.f={}; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }
  if(el=T("[data-ksel]")){ S.kl.sel=el.dataset.ksel; S.f={}; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }

  if(el=T("[data-scantab]")){ S.scan.tab=el.dataset.scantab; S.scan.pick=null; if(el.dataset.next) S.scan.state="ok"; render(); return; }
  if(el=T("[data-setloc]")){ setLoc(el.dataset.setloc); return; }
  if(el=T("[data-pick]")){ S.scan.pick=el.dataset.pick; S.scan.tab="scan"; render(); return; }
  if(el=T("[data-scan]")){ const loc=S.loc==="all"?"L-HAV":S.loc; const ppl=presPeople(loc); const who=S.scan.pick?B(S.scan.pick):S.scan.state==="flag"?ppl.find(needsDecision)||ppl[0]:ppl.find(b=>!checkedIn(b,TODAY)&&!needsDecision(b))||ppl[0]; const ev=el.dataset.scan; GATE.unshift({t:now(),res:who.id,ev,how:S.scan.pick?"Handmatig":"QR-badge",why:S.scan.pick?"Gezocht op naam":"",gate:"Poort 1",by:S.scan.pick?me().naam:"Systeem",loc,queued:S.offline}); if(S.offline) S.queue++; if(ev==="in"){ const p=PRES[who.id]||(PRES[who.id]={gaps:[],miss:[],leave:[]}); p.force=true; } S.scan.pick=null; render(); toast(`${who.naam}: melding geregistreerd om ${now()}${S.offline?" (bewaard, gaat mee bij verbinding)":""}`); return; }
});

addEventListener("resize",()=>closePop(false)); addEventListener("scroll",e=>{ if(POP&&!POP.el.contains(e.target)&&!POP.el.querySelector?.(".palette")) closePop(false); },true);
