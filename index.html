V.login = () => `<div style="min-height:72vh;display:grid;place-items:center"><div class="card stack" style="max-width:440px;width:100%;padding:32px;gap:18px;box-shadow:var(--sh2)"><svg width="44" height="44" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="#231F45"/><rect x="8" y="9" width="7" height="7" rx="1.5" fill="#F3F2F7"/><rect x="19" y="9" width="7" height="7" rx="1.5" fill="#F3F2F7"/><rect x="8" y="19" width="7" height="7" rx="1.5" fill="#F3F2F7"/><rect x="19" y="19" width="7" height="7" rx="1.5" fill="#D9822B"/></svg>
  ${S.login.sent?`<h1>Kijk in je mail</h1><p class="muted">We hebben een inloglink gestuurd naar <b>${esc(S.login.mail)}</b>. De link werkt 15 minuten.</p><button class="btn big" data-act="loginBack">${ic("back")}Ander e-mailadres</button>`:`<div><h1>Inloggen bij ShelterSync</h1><p class="muted" style="margin-top:6px">${ORG.name}</p></div><button class="btn dark big" data-act="loginSso">${ic("key")}Inloggen met organisatieaccount</button><div class="row" style="gap:10px"><span class="hr" style="flex:1"></span><span class="xs muted2">of met een inloglink</span><span class="hr" style="flex:1"></span></div><div class="field"><label for="lMail">E-mailadres</label><input id="lMail" class="inp ${S.login.err?"bad":""}" type="email" data-bind="login.mail" value="${esc(S.login.mail)}" placeholder="naam@thuisbasis.nl">${S.login.err?`<span class="err">Vul een geldig e-mailadres in</span>`:""}</div><button class="btn big" data-act="loginLink">${ic("mail")}Stuur inloglink</button>`}<p class="xs muted2">Beveiligers loggen in op het poorttoestel met een pincode. Tweestapsverificatie is verplicht voor alle andere rollen. Gastaccounts zijn alleen-lezen.</p></div></div>`;

/* =========================================================
   LAYERS: drawers and modals
   ========================================================= */
const F = () => S.f;
const btnClose = (t="Annuleren") => `<button class="btn" data-closelayer>${t}</button>`;
const assignOpts = loc => [{v:"",t:"Hele team van de locatie",d:"Iedereen ziet de taak; wie hem oppakt rondt af",icon:"users",grp:"Iedereen"},...Object.entries(TEAMS).filter(([k])=>k!=="mgmt").map(([k,t])=>({v:"t:"+k,t:"Team "+t.n,d:`${staffAt(loc).filter(p=>p.team===k).length} collega's`,icon:t.i,grp:"Teams"})),...staffAt(loc).map(p=>({v:"p:"+p.id,t:p.naam,d:FUNC(p.functie).rol+(onDuty(p)?" · nu in dienst":p.shift?` · ${p.shift[0]}–${p.shift[1]}`:" · vandaag vrij"),icon:"user",grp:"Collega's"}))];
const resOpts = loc => [{v:"",t:"Geen bewoner"},...residentsAt(loc).filter(b=>age(b.geb)>=18).map(b=>({v:b.id,t:b.naam,d:`${b.id} · ${WEof(wsOf(b.id).we)?.nr||""}`,icon:"user"}))];
const weOpts = loc => [{v:"",t:"Geen eenheid / algemeen"},...WE.filter(w=>w.loc===loc).map(w=>({v:w.id,t:w.nr,d:`${LOC(loc).units.find(u=>u.id===w.unit)?.naam} · ${w.type}`,grp:LOC(loc).units.find(u=>u.id===w.unit)?.naam}))];

function openPalette(){ closePop(false); const wrap=document.createElement("div"); wrap.innerHTML=`<div class="scrim" data-pclose></div><div class="palette" role="dialog" aria-label="Zoeken"><div class="pin">${ic("search")}<input id="palIn" placeholder="Zoek bewoner, eenheid, registratie, collega of pagina" autocomplete="off"><span class="kbd">esc</span></div><div class="res" id="palRes" role="listbox"></div><div class="pf"><span>↑↓ kiezen</span><span>↵ openen</span><span>esc sluiten</span></div></div>`; $("#poplayer").appendChild(wrap); const inp=$("#palIn"), res=$("#palRes"); let items=[];
  const draw=()=>{ const q=inp.value.trim().toLowerCase(); items=[]; const pages=NAV.flatMap(g=>g.items).filter(i=>allowed(i.id)&&(!q||i.t.toLowerCase().includes(q))).map(i=>({g:"Pagina's",t:i.t,i:i.i,a:()=>go(i.id)}));
    const people=CAN.residentsView()&&q?BEWONERS.filter(b=>{const w=wsOf(b.id);return w&&locOk(w.loc)&&(b.naam+b.id).toLowerCase().includes(q);}).slice(0,6).map(b=>({g:"Bewoners",t:b.naam,d:`${b.id} · ${LOC(wsOf(b.id).loc).naam} ${WEof(wsOf(b.id).we)?.nr||""}`,i:"user",a:()=>openRes(b.id)})):[];
    const wes=q?WE.filter(w=>locOk(w.loc)&&w.nr.toLowerCase().includes(q)).slice(0,4).map(w=>({g:"Wooneenheden",t:`${w.nr} · ${LOC(w.loc).naam}`,d:w.type,i:"bed",a:()=>{S.f={};openLayer("drawer","we",w.id);}})):[];
    const abis=q&&allowed("dagjournaal")?ABI.filter(e=>visible(e)&&(e.id+e.oms+e.sub).toLowerCase().includes(q)).slice(0,5).map(e=>({g:"Dagjournaal",t:e.sub,d:`${e.id} · ${fd(e.date)} · ${e.oms.slice(0,50)}`,i:"log",a:()=>{S.f={};openLayer("drawer","abiview",e.id);}})):[];
    const staff=q&&CAN.staff()?MEDEWERKERS.filter(p=>p.naam.toLowerCase().includes(q)).slice(0,4).map(p=>({g:"Medewerkers",t:p.naam,d:FUNC(p.functie).rol,i:"key",a:()=>{S.f=FORM_INIT.staff(p.id);openLayer("drawer","staff",p.id);}})):[];
    const acts=[["Nieuwe registratie","log",()=>openL("modal","abi","new"),CAN.journalWrite()],["Nieuwe taak","plus",()=>openL("modal","abi","task"),CAN.journalWrite()],["Weergave: thema en leesbaarheid","eye",()=>openL("drawer","weergave"),true]].filter(a=>a[3]&&(!q||a[0].toLowerCase().includes(q))).map(a=>({g:"Acties",t:a[0],i:a[1],a:a[2]}));
    items=[...people,...wes,...abis,...staff,...acts,...pages].slice(0,16); let g=null; res.innerHTML=items.length?items.map((x,i)=>(x.g!==g?`<div class="grp">${g=x.g}</div>`:"")+`<button type="button" class="opt ${i===0?"act":""}" data-pi="${i}" role="option"><span class="lead">${ic(x.i,"s")}</span><span class="ot"><b>${esc(x.t)}</b>${x.d?`<small>${esc(x.d)}</small>`:""}</span>${ic("chevr","s muted2")}</button>`).join(""):`<div class="none">Geen resultaten voor “${esc(inp.value)}”.</div>`; };
  const close=()=>{ wrap.remove(); POP=null; }; const run=i=>{ const x=items[i]; if(!x) return; close(); x.a(); };
  POP={el:wrap,anchor:$("#cmdk"),onKey:e=>{ const opts=$$(".opt",res); let i=opts.findIndex(o=>o.classList.contains("act")); if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); opts[i]?.classList.remove("act"); i=(i+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length; opts[i]?.classList.add("act"); opts[i]?.scrollIntoView({block:"nearest"}); } if(e.key==="Enter"){ e.preventDefault(); run(+opts[i]?.dataset.pi); } }};
  inp.addEventListener("input",draw); res.addEventListener("click",e=>{const b=e.target.closest("[data-pi]"); if(b) run(+b.dataset.pi);}); wrap.querySelector("[data-pclose]").addEventListener("click",close); draw(); inp.focus(); }

function renderShell(){ const m=me(); const Rr=ROLES[S.role];
  $("#whoName").textContent=m.naam; $("#whoRole").textContent=FUNC(m.functie).rol; $("#whoAv").textContent=ini(m.naam); $("#brandSub").textContent=Rr.sub;
  $("#roles").innerHTML=Object.entries(ROLES).map(([k,r])=>`<button type="button" role="radio" aria-checked="${S.role===k}" data-role="${k}" data-fid="role:${k}">${r.label}</button>`).join("");
  const lb=$("#locBtn"); lb.innerHTML=`${ic("building")}<span class="lt"><small>${S.loc==="all"?"Overzicht":"Locatie"}</small><b>${S.loc==="all"?`Alle mijn locaties (${myLocs().filter(id=>locActive(LOC(id))).length})`:`${LOC(S.loc).naam} · ${LOC(S.loc).gemeente}`}</b></span>${ic("updown","s")}`;
  $("#ctx").innerHTML=`<button type="button" class="locbtn" id="ctxBtn" aria-haspopup="listbox" aria-expanded="false"><span class="l">${S.loc==="all"?"Overzicht":"Locatie"}</span><span class="v">${S.loc==="all"?"Alle mijn locaties":LOC(S.loc).naam}</span>${ic("updown","s")}</button>`;
  $("#nav").innerHTML=NAV.map(g=>{const its=g.items.filter(i=>i.r.includes("*")||i.r.includes(S.role)); if(!its.length) return ""; return `<div class="navgrp"><span class="h">${g.h}</span>${its.map(i=>{const c=i.c?i.c():0; const cur=S.view===i.id||(S.view==="dossier"&&i.id==="bewoners")||(S.view==="locatie"&&i.id==="locaties"); return `<a class="nav" href="#${i.id}" data-go="${i.id}" data-fid="nav:${i.id}" ${cur?'aria-current="page"':""}>${ic(i.i)}<span>${i.t}</span>${c?`<span class="cnt">${c}</span>`:""}</a>`}).join("")}</div>`}).join("");
  $("#bellDot").hidden=S.notifRead||!myNotifs().length; $("#syncPill").className="syncpill hide-s"+(S.offline?" off":""); $("#syncPill").innerHTML=`<i></i>${S.offline?`Offline${S.queue?` · ${S.queue} wacht`:""}`:"Gesynchroniseerd"}`; }
function render(){ const a=document.activeElement; const fid=a?.dataset?.fid, aid=a?.id; const sel=a&&"selectionStart" in a?[a.selectionStart,a.selectionEnd]:null;
  if(!myLocs().includes(S.loc)&&S.loc!=="all") S.loc=myLocs()[0]; if(S.loc==="all"&&myLocs().length===1) S.loc=myLocs()[0];
  if(!allowed(S.view)) S.view=ROLES[S.role].home; renderShell(); $("#view").innerHTML=V[S.view](); renderLayer();
  const t=(fid&&$(`[data-fid="${CSS.escape(fid)}"]`))||(aid&&document.getElementById(aid)); if(t&&t!==document.body){ t.focus({preventScroll:true}); if(sel&&"setSelectionRange" in t){ try{t.setSelectionRange(...sel)}catch(_){} } } else if(S.layer){ $("#layer .drawer, #layer .modal")?.querySelector("input,textarea,button.sel,[data-closelayer].iconbtn")?.focus({preventScroll:true}); } }
function go(v){ closePop(false); S.layer=null; S.view=v; try{history.replaceState(null,"","#"+v)}catch(e){} $("#side").classList.remove("open"); render(); window.scrollTo(0,0); $("#view").focus({preventScroll:true}); }

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("pointerdown",e=>{ if(POP&&!POP.el.contains(e.target)&&!POP.anchor?.contains(e.target)&&!e.target.closest(".palette")) closePop(false); },true);
document.addEventListener("click",e=>{ const T=s=>e.target.closest(s); let el;
  if(T("[data-closelayer]")){ closeLayer(); return; }
  if(el=T("[data-sel]")){ if(POP?.anchor===el){ closePop(); return; } openSelect(el); return; }
  if(el=T("[data-date]")){ if(POP?.anchor===el){ closePop(); return; } openDate(el); return; }
  if(el=T("[data-menu]")){ e.stopPropagation(); if(POP?.anchor===el){ closePop(); return; } openMenu(el,el.dataset.menu,el.dataset.arg); return; }
  if(T("#cmdk")){ openPalette(); return; }
  if(el=T("#bellBtn")){ if(POP?.anchor===el){ closePop(); return; } openNotifs(el); return; }
  if(el=T("#userBtn")){ if(POP?.anchor===el){ closePop(); return; } openMenu(el,"user"); return; }
  if(el=T("#ctxBtn,#locBtn")){ if(POP?.anchor===el){ closePop(); return; } openLocs(el); return; }
  if(T("#burger")){ $("#side").classList.toggle("open"); return; }
  if(T("#poplayer")) return;
  if((el=T("[aria-disabled='true']"))&&el.matches(".ccard")) return;
  if(el=T("[data-set]")){ const p=el.dataset.set, cur=get(p); set(p,typeof cur==="number"?+el.dataset.val:el.dataset.val); if(p==="locv.tab") S.locv.unit="all"; if(p.startsWith("ui.")) applyUI(); render(); return; }
  if(el=T("[data-toggle]")){ const s=get(el.dataset.toggle); const v=el.dataset.val; s.has(v)?s.delete(v):s.add(v); render(); return; }
  if(el=T("[data-flip]")){ set(el.dataset.flip,!get(el.dataset.flip)); render(); return; }
  if(el=T("[data-inc]")){ const p=el.dataset.inc; set(p,Math.max(+el.dataset.min,Math.min(+el.dataset.max,get(p)+ +el.dataset.d))); render(); return; }
  if(el=T("[data-role]")){ S.role=el.dataset.role; S.layer=null; closePop(false); S.loc=S.role==="regio"?"all":me().locs.find(l=>locActive(LOC(l)))||me().locs[0]; S.view=ROLES[S.role].home; S.selLoc=null; render(); window.scrollTo(0,0); return; }
  if(el=T("[data-go]")){ e.preventDefault(); go(el.dataset.go); return; }
  if(el=T("[data-open-res]")){ if(!CAN.residentsView()){ toast("Bewonersdossiers zijn niet zichtbaar voor jouw rol"); return; } openRes(el.dataset.openRes); return; }
  if(el=T("[data-goto]")){ const [v,a]=el.dataset.goto.split(":"); if(v==="taken") S.tk.tab=a==="alle"&&!CAN.manager()?"mijn":a; if(v==="meldingen"){ S.md.tab="open"; } if(v==="klachten") S.kl.tab="open"; if(v==="locatie"){ S.selLoc=a; S.locv.tab="units"; S.locv.unit="all"; } if(v==="opdrachtgevers") S.og.sel=a; go(v); return; }
  if(el=T("[data-layer]")){ const [type,name,...rest]=el.dataset.layer.split(":"); openL(type,name,rest.join(":")); return; }
  if(el=T("[data-act]")){ const fn=ACT[el.dataset.act]; if(fn){ fn(el); render(); } return; }
  if(el=T("[data-tdone]")){ e.stopPropagation(); const x=ABI.find(z=>z.id===el.dataset.tdone); if(x.status==="klaar"){ x.status="open"; x.gereed=null; x.log.push({t:"Heropend",w:`${fdate(TODAY)} ${now()} · ${me().naam}`}); render(); toast(`${x.id} heropend`); } else { S.f=FORM_INIT.done(x.id); openLayer("modal","done",x.id); } return; }
  if(el=T("[data-abi]")){ S.f={}; openLayer("drawer","abiview",el.dataset.abi); return; }
  if(el=T("[data-sort]")){ const k=el.dataset.sort; S.bw.dir=S.bw.sort===k?-S.bw.dir:1; S.bw.sort=k; render(); return; }
  if(el=T("[data-msel]")){ S.md.sel=el.dataset.msel; S.f={}; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }
  if(el=T("[data-ksel]")){ S.kl.sel=el.dataset.ksel; S.f={}; render(); if(innerWidth<1180) $(".sticky")?.scrollIntoView({behavior:"smooth"}); return; }
  if(el=T("[data-ogsel]")){ S.og.sel=el.dataset.ogsel; render(); return; }
  if(el=T("[data-setloc]")){ const v=S.view; setLoc(el.dataset.setloc); if(v==="dashboard") go("dashboard"); if(v==="locaties"||v==="locatie"){ S.selLoc=el.dataset.setloc; go("locatie"); } return; }
  if(el=T("[data-scantab]")){ S.scan.tab=el.dataset.scantab; S.scan.pick=null; render(); return; }
  if(el=T("[data-pick]")){ S.scan.pick=el.dataset.pick; S.scan.tab="scan"; render(); return; }
  if(el=T("[data-scan]")){ const loc=S.loc==="all"?"L-HAV":S.loc; const ppl=presPeople(loc); const who=S.scan.pick?B(S.scan.pick):S.scan.state==="flag"?ppl.find(needsDecision)||ppl[0]:ppl.find(b=>!checkedIn(b,TODAY)&&!needsDecision(b))||ppl[0]; const ev=el.dataset.scan; GATE.unshift({t:now(),res:who.id,ev,how:S.scan.pick?"Handmatig":"QR-badge",why:S.scan.pick?"Gezocht op naam":"",gate:"Poort 1",by:S.scan.pick?me().naam:"Systeem",loc,queued:S.offline}); if(S.offline) S.queue++; if(ev==="in"){ const p=PRES[who.id]||(PRES[who.id]={gaps:[],miss:[],leave:[]}); p.force=true; } S.scan.pick=null; render(); toast(`${who.naam}: ${ev==="in"?"naar binnen, check-in geregistreerd":"naar buiten"}${S.offline?" (bewaard, gaat mee bij verbinding)":""}`); return; }
});
document.addEventListener("input",e=>{ const t=e.target; if(t.dataset.bind){ set(t.dataset.bind,t.value); t.classList.remove("bad"); return; } if(t.dataset.bindLive){ set(t.dataset.bindLive,t.value); render(); } });
document.addEventListener("mouseover",e=>{ const g=e.target.closest?.("[data-twk]"); if(!g) return; const [id,i]=g.dataset.twk.split(":"); const out=$("#trRead-"+id); const d=TRENDH[id]?.[+i]; if(!out||!d) return; out.innerHTML=`<b style="color:var(--ink)">Week ${d.w}${d.w===CUR_WEEK?" (nu)":""}</b> · ${d.tasks} open taken · ${d.hi} incidenten hoog · ${d.kl} open klachten · ${d.jr} registraties`; });
document.addEventListener("keydown",e=>{ if(POP?.onKey) POP.onKey(e); if(e.key==="Escape"){ if(POP){ e.preventDefault(); if(POP.el.querySelector(".palette")){ POP.el.remove(); POP=null; } else closePop(); return; } if(S.layer){ closeLayer(); return; } $("#side").classList.remove("open"); } const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName); if((e.key==="/"&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k")){ e.preventDefault(); openPalette(); } if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".task")){ e.preventDefault(); e.target.click(); } if(e.key==="Tab"&&S.layer&&!POP){ const box=$("#layer .drawer, #layer .modal"); const f=$$("button:not([disabled]),input,textarea,[tabindex]:not([tabindex='-1'])",box); if(f.length){ if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();} } } });
addEventListener("resize",()=>closePop(false)); addEventListener("scroll",e=>{ if(POP&&!POP.el.contains(e.target)&&!POP.el.querySelector?.(".palette")) closePop(false); },true);
/* checked-in override after a live scan */
const _checkedIn=checkedIn; checkedIn=(b,iso)=>(iso===TODAY&&PRES[b.id]?.force)||_checkedIn(b,iso);
loadUI();
const h0=(location.hash||"").slice(1); if(h0&&V[h0]&&allowed(h0)) S.view=h0;
render();
</script>
